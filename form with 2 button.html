<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form</title>

	<style>
		
		body {
			justify-content: center;
			align-content: center;
			display: flex;
			text-align: center;
			font-family: Montserrat;
		}

		form {
			margin-top: 200px;
		}

		input {
			width: 300px;
			height: 20px;
			border-radius: 5px;
			border: 1px solid black;
		}

		button {
			width: 70px;
			height: 30px;
			background-color: seagreen;
			color: white;
			border: none;
			border-radius: 5px;
		}

		#btn1 {
			float: left;
		}

		#btn2 {
			float: right;
		}

		button:hover {
			background-color: white;
			border: 1px solid seagreen;
			color: seagreen;
			transition: .5s;
		}

	</style>


</head>
<body>

	<form>

		<p>Sign up</p>
		
		<input type="text" name="username" id="name" placeholder="Username">
		<br><br>
		<input type="password" name="password" id="password" placeholder="Password">

		<br><br>

		<button type="button" id="btn1" onclick="savevalues()">Save</button>
		<button type="button" id="btn2" onclick="showvalues()">Show</button>

		<h1 id="res"></h1>

	</form>


	<script>

		// arr = [];
		
		function savevalues() {

			let user = document.getElementById("name").value.trim();
			let pwd = document.getElementById("password").value.trim();

			let details = user + pwd

			let arr = details.split("")

			function showvalues() {
				
				result = "";

				for (let i = 0; i < arr; i++){
					result += arr[i] + "<br>"
				}

				document.getElementById('res').innerHTML = result;

			}

		}


	</script>



</body>
</html>
