<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>This Keyword</title>
</head>
<body>

	<script>
		
		let car = {
			name: "BMW",
			color: "Blue",

			cardetails : function() {
				document.write("Car: " + this.name + ", Color: " + this.color)
			}
		}

		car.cardetails()

	</script>

</body>
</html>
