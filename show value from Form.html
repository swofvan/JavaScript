<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Form</title>

	<style>
		
		body {
			justify-content: center;
			align-content: center;
			display: flex;
			text-align: center;
			font-family: Montserrat;
		}

		form {
			margin-top: 200px;
		}

		input {
			width: 300px;
			height: 20px;
			border-radius: 5px;
			border: 1px solid black;
		}

		textarea {
			max-width: 300px;
			min-width: 300px;
			height: 100px;
			border-radius: 5px;
			border: 1px solid black;
		}

		button {
			width: 70px;
			height: 30px;
			background-color: seagreen;
			color: white;
			border: none;
			border-radius: 5px;
			float: right;
		}

		button:hover {
			background-color: white;
			border: 1px solid seagreen;
			color: seagreen;
			transition: .5s;
		}

	</style>

</head>
<body>

	<form>

		<h1>Review</h1>
		
		<input type="text" name="username" id="name" placeholder="Username" required>
		<br><br>
		<textarea placeholder="Enter your message" id="txt" required></textarea>

		<br><br>

		<button type="button" id="btn" onclick="submitform()">Submit</button>

		<br><br>

		<p id="result"></p>

	</form>

	<script>
		
		function submitform() {

			let text = document.getElementById("txt").value.trim();

			document.getElementById("result").innerHTML = "<lighter>Message:</lighter> <b>" + text + "</b>";
		}

	</script>

</body>
</html>
