<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>array within an object</title>
</head>
<body>

	<script>
		
		var person = {
			name : "Swofvan",
			Age : 20,
			loc :  ["Malappuram", "Kuttippuram", "Kochi"]
		}

		console.log(person);
		console.log(person.name);
		console.log(person.Age);
		console.log(person.loc[1]);

	</script>

</body>
</html>
